services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rastreo_tracker
      POSTGRES_PASSWORD: rastreo_tracker_dev
      POSTGRES_DB: rastreo_tracker
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastreo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rastreo_tracker:rastreo_tracker_dev@db:5432/rastreo_tracker
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next

volumes:
  db_data:
  app_node_modules:
  app_next_cache:
