services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rastreo_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rastreo_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastreo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rastreo_tracker:${POSTGRES_PASSWORD}@db:5432/rastreo_tracker
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_PIN: ${ADMIN_PIN}
    ports:
      - "${APP_PORT:-3002}:3000"

volumes:
  db_data:
