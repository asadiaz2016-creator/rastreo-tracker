services:
  - type: web
    name: rastreo-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /estado
    envVars:
      # Paste your Neon connection string here (Render dashboard -> this
      # service -> Environment). Using Neon instead of Render's own free
      # Postgres because Render deletes free-tier databases after 90
      # days -- Neon's free tier has no expiration. See README for setup.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # PIN de administrador -- solo se usa para crear el hash inicial la
      # primera vez que el seed corre contra una base de datos nueva.
      - key: ADMIN_PIN
        sync: false
